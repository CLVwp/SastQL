# Release: push a tag `v*` → build every target natively on its runner,
# publish one npm platform package per target, then the main `sastql` package.
# Auth: npm trusted publishing (OIDC) — each package must list CLVwp/SastQL +
# release.yml as trusted publisher on npmjs.com; no NPM_TOKEN secret involved.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    environment: Github-Action-SastQL-Release
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
      - name: Assemble npm platform package
        id: pkg
        shell: bash
        run: echo "dir=$(node npm/scripts/make-platform-package.mjs ${{ matrix.target }})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Publish platform package
        run: npm publish --access public --provenance
        working-directory: ${{ steps.pkg.outputs.dir }}

  npm-main:
    needs: platform
    runs-on: ubuntu-latest
    environment: Github-Action-SastQL-Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Stamp version
        run: node npm/scripts/stamp-main.mjs "${GITHUB_REF_NAME#v}"
      - name: Copy license
        run: cp LICENSE npm/LICENSE
      - name: Publish main package
        run: npm publish --access public --provenance
        working-directory: npm
