[package]
name = "sastql"
version = "0.3.0"
edition = "2024"
# Floor set by edition 2024; bump only when a dependency demands it.
rust-version = "1.85"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
toml = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
